# PR Review workflows.
# The intention is for these to only find *new* issues.

name: pr-review
on:
  workflow_dispatch:
  pull_request:
# reviewdog's github-pr-review reporter posts review comments on the pull
# request, so it needs pull-requests: write.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  shellcheck-code:
    name: shellcheck grml-debootstrap
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep GITHUB_TOKEN out of .git/config; the third-party reviewdog
          # step below receives its token explicitly.
          persist-credentials: false
      - name: shellcheck
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427  # v1.34.1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          path: "."
          pattern: |
            chroot-script
            grml-debootstrap
            config
            tests/shellcheck-stub-debootstrap-variables
          check_all_files_with_shebangs: "false"

  shellcheck-tests:
    name: shellcheck test scripts
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep GITHUB_TOKEN out of .git/config; the third-party reviewdog
          # step below receives its token explicitly.
          persist-credentials: false
      - name: shellcheck
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427  # v1.34.1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          path: tests
          pattern: |
            *.sh
          check_all_files_with_shebangs: "false"
