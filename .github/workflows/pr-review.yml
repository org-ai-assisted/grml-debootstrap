# PR Review workflows.
# The intention is for these to only find *new* issues.

name: pr-review
on:
  workflow_dispatch:
  pull_request:
# reviewdog's github-pr-review reporter posts review comments on the pull
# request, so it needs pull-requests: write.
permissions:
  contents: read
  pull-requests: write
jobs:

  shellcheck-code:
    name: shellcheck grml-debootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep GITHUB_TOKEN out of .git/config; the third-party reviewdog
          # step below receives its token explicitly.
          persist-credentials: false
      - name: shellcheck
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          path: "."
          pattern: |
            chroot-script
            grml-debootstrap
            config
            tests/shellcheck-stub-debootstrap-variables
          check_all_files_with_shebangs: "false"

  shellcheck-tests:
    name: shellcheck test scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep GITHUB_TOKEN out of .git/config; the third-party reviewdog
          # step below receives its token explicitly.
          persist-credentials: false
      - name: shellcheck
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          path: tests
          pattern: |
            *.sh
          check_all_files_with_shebangs: "false"
