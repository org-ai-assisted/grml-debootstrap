name: reproducible-build

# Prove grml-debootstrap builds a bit-for-bit reproducible VM image: build the .deb, then build
# the SAME image twice with deterministic inputs and compare. A green run means the image is
# reproducible; a red run uploads a diffoscope report showing exactly what still differs.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly, offset from test-build's 03:30 slot to avoid contending for runners.
    - cron: '30 4 * * 2'

concurrency:
  group: "reproducible-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-deb:
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the repo and uploads an artifact.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # This workflow runs PR-supplied build scripts in a --privileged
          # container; do not leave the token on disk for them to read.
          persist-credentials: false

      - run: ./tests/gha-build-deb.sh
        name: "Build .deb for trixie"
        env:
          HOST_RELEASE: trixie

      - name: Archive built .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-trixie
          if-no-files-found: error
          path: |
            *.deb

  reproducible:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download built deb
        uses: actions/download-artifact@v8
        with:
          name: deb-trixie

      - run: ./tests/reproducible-build.sh
        name: "Build the VM image twice and compare (SOURCE_DATE_EPOCH + FIXED_DISK_IDENTIFIERS)"
        env:
          HOST_RELEASE: trixie
          RELEASE: trixie
          TARGET: VM

      - name: Archive diffoscope report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reproducible-report
          path: reproducible-report.txt
          if-no-files-found: warn
          retention-days: 14

  # Prove the reproducible image (built with the stripped per-install secrets) is
  # still FUNCTIONAL: build one image in reproducible mode, boot it under qemu and
  # run goss, which asserts sshd is running. This exercises the key-stripping path
  # end to end -- the removed SSH host keys must be regenerated on first boot by
  # Debian's sshd-keygen.service (triggered by the emptied /etc/machine-id).
  functional-reproducible:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download built deb
        uses: actions/download-artifact@v8
        with:
          name: deb-trixie

      - run: ./tests/build-vm-and-test.sh setup
        name: "Setup test environment"

      - run: ./tests/build-vm-and-test.sh run
        name: "Build a REPRODUCIBLE VM image (SOURCE_DATE_EPOCH + stripped secrets)"
        env:
          HOST_RELEASE: trixie
          RELEASE: trixie
          TARGET: VM
          SOURCE_DATE_EPOCH: "1767225600"
          FIXED_DISK_IDENTIFIERS: "yes"

      - run: ./tests/build-vm-and-test.sh test
        name: "Boot the reproducible image and run goss (sshd must come up)"
        env:
          RELEASE: trixie
          TARGET: VM

      - name: Archive VM image + results on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducible-functional-results
          path: |
            tests/results/
            qemu.img
          if-no-files-found: warn
          retention-days: 7
